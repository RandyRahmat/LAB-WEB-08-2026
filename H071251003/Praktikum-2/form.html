    <main>
        <p></p>
        <form action="#" method="POST" id="BookingForm">
            <fieldset>
                <legend><strong>Booking Wisata:</strong></legend>
                <label for="namaInp">Nama:</label>
                <input type="text" id="namaInp" placeholder="Nama Lengkap" name="ama" required>*
                <p></p>
                <label for="emailInp">Email:</label>
                <input type="email" id="emailInp" placeholder="Email" required>*
                <p></p>
                <label for="HPInp">Nomor HP:</label>
                <input type="tel" id="HPInp" placeholder="08XXXXXXXXXX" required>*
                <p></p>
                <label for="TamuInp">Tamu:</label>
                <input type="number" min="1" id="TamuInp" placeholder="Jumlah Tamu" required>*
                <p></p>
                <label for="ReservInp1">Waktu Reservasi:</label>
                <input type="date" id="ReservInp1" required>*
                <p></p>
                <label for="ReservInp2">Jam Reservasi:</label>
                <select name="Waktu" id="ReservInp2" required>
                    <option value="">--N/A--</option>
                    <option value="08:00">08:00 WITA</option>
                    <option value="12:00">12:00 WITA</option>
                    <option value="16:00">16:00 WITA</option>
                    <option value="20:00">20:00 WITA</option>
                </select>*
                <p></p>
                <label for="notesInp">Catatan:</label><br>
                <textarea name="Notes" id="notesInp" rows="5" cols="35" placeholder="Bila ada catatan tambahan, dapat ditulis disini"></textarea><p></p>
                <button type="submit">Booking</button>
            </fieldset>
        </form>
    </main>
